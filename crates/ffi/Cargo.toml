[package]
name = "kmark-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "KMark L4 C-ABI bridge between the safe Rust engine and the native KDE Frameworks 6 / Qt6 C++ shell"

[lib]
crate-type = ["staticlib", "rlib"]

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "warn"

[dependencies]
kmark-buffer.workspace = true
kmark-syntax.workspace = true
kmark-layout.workspace = true
kmark-engine.workspace = true
unicode-segmentation.workspace = true
